name: Pages

# Refreshes the CURRENT latest docs version's content on every docs change to
# main - no new entry in the version dropdown, just an in-place update of
# whatever "latest" already points to. A new version entry (tracking a dwpk
# major.minor release) is cut by the "docs" job in github-release.yml
# instead, not here.
#
# Requires Settings -> Pages -> Source = "Deploy from a branch: gh-pages",
# since mike (the mkdocs-material version switcher) owns that branch itself.
on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - mkdocs.yml
      - README.md
      - .github/workflows/github-pages.yml
  workflow_dispatch: {}

permissions: {}

jobs:
  deploy:
    name: Refresh latest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3"

      - name: Install mkdocs-material and mike
        run: pip install mkdocs-material mike

      - name: Resolve the version "latest" currently points to
        id: resolve
        run: |
          # mike resolves the "gh-pages" ref literally (git show gh-pages:...),
          # so this has to create a local branch by that exact name, not just
          # populate FETCH_HEAD.
          git fetch origin gh-pages:gh-pages --depth=1 2>/dev/null || true
          version=$(mike list --json 2>/dev/null | python3 -c "
          import json, sys
          for entry in json.load(sys.stdin):
              if 'latest' in entry.get('aliases', []):
                  print(entry['version'])
                  break
          " || true)
          if [ -z "$version" ]; then
            echo "No existing 'latest' version on gh-pages yet - nothing to refresh. The first version is published by github-release.yml's docs job."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.resolve.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mike deploy --push --update-aliases "${{ steps.resolve.outputs.version }}" latest
