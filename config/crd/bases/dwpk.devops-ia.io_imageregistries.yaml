kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: imageregistries.dwpk.devops-ia.io
spec:
  group: dwpk.devops-ia.io
  names:
    kind: ImageRegistry
    listKind: ImageRegistryList
    plural: imageregistries
    singular: imageregistry
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.provider
      name: Provider
      type: string
    - jsonPath: .status.images
      name: Images
      type: integer
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ImageRegistry is the Schema for the imageregistries API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ImageRegistry
            properties:
              aws:
                description: aws configures an AWS ECR registry. Required when provider
                  is "aws-ecr".
                properties:
                  region:
                    description: region is the AWS region the registry lives in.
                    maxLength: 32
                    type: string
                  registryId:
                    description: |-
                      registryId is the AWS account ID that owns the registry. Empty means the
                      account the resolved credentials belong to - which is what IRSA, EKS Pod
                      Identity and an instance profile all resolve to without this ever being
                      set. It only needs a value for a registry in a different account.
                    maxLength: 12
                    type: string
                  roleArn:
                    description: |-
                      roleArn is assumed via STS before listing, for a registry in another
                      account reached through a cross-account role rather than a same-account
                      identity. Empty uses the caller's own resolved credentials directly.
                    maxLength: 2048
                    type: string
                required:
                - region
                type: object
              imagePullSecretRef:
                description: |-
                  imagePullSecretRef names a Secret, in the manager's own namespace, that
                  dwpk replicates into every user namespace so a private image can
                  actually be pulled. Every WorkspaceImage this registry creates carries
                  the same reference.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              provider:
                description: |-
                  provider selects which registry API this object talks to. "aws-ecr" is
                  the only value Phase 1 implements; adding a second provider is a new
                  value here plus a new registry.Provider implementation, not a change to
                  this type.
                enum:
                - aws-ecr
                type: string
              sync:
                description: sync configures how the registry is polled and which
                  images are kept.
                properties:
                  exclude:
                    description: |-
                      exclude is matched the same way as include, and wins when both match -
                      an explicit exclusion is a stronger statement than a broad include.
                    items:
                      type: string
                    type: array
                  include:
                    description: |-
                      include is a list of RE2 patterns matched against a repository name. A
                      repository matching none of them is skipped. Empty means every
                      repository is a candidate.
                    items:
                      type: string
                    type: array
                  intervalSeconds:
                    default: 900
                    description: |-
                      intervalSeconds is how often the registry is re-listed. Requeue-based,
                      not a fixed background tick - see the controller's Reconcile for why a
                      timer is the right tool here.
                    format: int32
                    minimum: 60
                    type: integer
                  prune:
                    default: false
                    description: |-
                      prune deletes a WorkspaceImage this registry previously created once its
                      remote image is gone. Off by default: a registry that is briefly
                      unreachable or briefly returns a short list should not delete a catalog
                      entry somebody may be using.
                    type: boolean
                  tags:
                    description: tags picks which tag(s) of a matching repository
                      are synced.
                    properties:
                      limit:
                        default: 1
                        description: |-
                          limit caps how many tags per repository become catalog entries, newest
                          first. A repository with no requested cap could otherwise turn one
                          pattern match into hundreds of entries.
                        format: int32
                        minimum: 1
                        type: integer
                      mode:
                        default: latest
                        description: |-
                          mode picks the newest tag ("latest", by push time) or every tag matching
                          patterns.
                        enum:
                        - latest
                        - pattern
                        type: string
                      patterns:
                        description: |-
                          patterns are RE2 expressions matched against a tag name. Used only when
                          mode is "pattern"; ignored otherwise.
                        items:
                          type: string
                        type: array
                    type: object
                type: object
            required:
            - provider
            type: object
          status:
            description: status defines the observed state of ImageRegistry
            properties:
              conditions:
                description: conditions represent the current state of the ImageRegistry
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              images:
                description: images is how many WorkspaceImages this registry currently
                  owns.
                format: int32
                type: integer
              lastSyncTime:
                description: lastSyncTime is when the registry was last successfully
                  listed.
                format: date-time
                type: string
              observedGeneration:
                description: |-
                  observedGeneration is the metadata.generation this status was computed
                  from.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: spec.aws is required when spec.provider is aws-ecr
          rule: self.spec.provider != 'aws-ecr' || has(self.spec.aws)
    served: true
    storage: true
    subresources:
      status: {}
