---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: platformconfigs.dwpk.devops-ia.io
spec:
  group: dwpk.devops-ia.io
  names:
    kind: PlatformConfig
    listKind: PlatformConfigList
    plural: platformconfigs
    shortNames:
    - pfc
    singular: platformconfig
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Name
      type: string
    - jsonPath: .spec.defaultTheme
      name: Theme
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PlatformConfig is the Schema for the platformconfigs API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PlatformConfig
            properties:
              defaultTheme:
                default: system
                description: |-
                  defaultTheme is the appearance for anyone who has not chosen one.

                  It is a default, not an enforcement: a viewer's own choice still wins.
                  Taking somebody's chosen theme away from them is not a setting, it is a
                  bug they cannot fix.
                enum:
                - system
                - light
                - dark
                type: string
              displayName:
                description: |-
                  displayName is what the platform calls itself in titles and in the
                  sidebar. Empty means "dwpk".
                maxLength: 64
                type: string
              gpuResourceName:
                default: nvidia.com/gpu
                description: |-
                  gpuResourceName is the extended resource a GPU is requested as.

                  It is configuration because the name is the vendor's, not Kubernetes':
                  nvidia.com/gpu, amd.com/gpu, or a MIG slice like nvidia.com/mig-1g.5gb.
                  This is the name the GPU quota counts and the one the workspace form
                  offers; a workspace may still name a different extended resource, and
                  that one simply is not counted by the GPU quota.
                maxLength: 253
                type: string
              logo:
                description: |-
                  logo is the brand mark, reused as the favicon. Unset falls back to the
                  built-in mark.
                properties:
                  contentType:
                    description: |-
                      contentType is the image's media type, used verbatim in the response that
                      serves it.
                    enum:
                    - image/png
                    - image/svg+xml
                    - image/jpeg
                    - image/webp
                    type: string
                  data:
                    description: |-
                      data is the image itself, base64 in the serialised object as any []byte
                      is.

                      It lives on the object rather than in a ConfigMap so the settings are one
                      thing to read, write and back up. The size cap is what keeps that
                      reasonable: 120x120 of PNG is a few kilobytes, and the ceiling here is
                      generous enough for a retina asset while staying far below what makes an
                      etcd object awkward.
                    format: byte
                    maxLength: 131072
                    type: string
                required:
                - contentType
                - data
                type: object
              supportEmail:
                description: |-
                  supportEmail is who to contact when the platform will not let somebody in.

                  It lives here rather than being looked up because the only screens that
                  need it are the ones nobody has signed in to yet. The sign-in page holds
                  no token, so it cannot list UserSpaces to find an administrator; a
                  disabled account would otherwise be told it is disabled and nothing else.
                maxLength: 254
                type: string
            type: object
          status:
            description: status defines the observed state of PlatformConfig
            properties:
              conditions:
                description: conditions represent the current state of the PlatformConfig
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: the platform configuration is a singleton and must be named 'cluster'
          rule: self.metadata.name == 'cluster'
    served: true
    storage: true
    subresources:
      status: {}
