# This rule is not used by the project dwpk itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to dwpk.devops-ia.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: dwpk
    app.kubernetes.io/managed-by: kustomize
  name: workspaceimage-viewer-role
rules:
- apiGroups:
  - dwpk.devops-ia.io
  resources:
  - workspaceimages
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - dwpk.devops-ia.io
  resources:
  - workspaceimages/status
  verbs:
  - get
