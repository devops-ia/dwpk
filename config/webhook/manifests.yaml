---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-dwpk-devops-ia-io-v1alpha1-workspace
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: mworkspace-v1alpha1.dwpk.devops-ia.io
  rules:
  - apiGroups:
    - dwpk.devops-ia.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    resources:
    - workspaces
  sideEffects: None
  timeoutSeconds: 5
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-dwpk-devops-ia-io-v1alpha1-userspace
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: vuserspace-v1alpha1.dwpk.devops-ia.io
  rules:
  - apiGroups:
    - dwpk.devops-ia.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - userspaces
  sideEffects: None
  timeoutSeconds: 5
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-dwpk-devops-ia-io-v1alpha1-workspace
  failurePolicy: Fail
  matchPolicy: Equivalent
  name: vworkspace-v1alpha1.dwpk.devops-ia.io
  rules:
  - apiGroups:
    - dwpk.devops-ia.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - workspaces
  sideEffects: None
  timeoutSeconds: 5
