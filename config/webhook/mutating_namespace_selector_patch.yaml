# Same rule as the validating patch, for the mutating configuration. Matched by
# webhook name so adding another mutating webhook cannot move it (SPEC §7.5).
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- name: mworkspace-v1alpha1.dwpk.devops-ia.io
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: NotIn
        values:
          - dwpk-system
          - kube-system
